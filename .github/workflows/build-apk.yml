name: Build OPIc Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Android project
      run: |
        mkdir -p android/app/src/main/java/com/opic/app
        mkdir -p android/app/src/main/assets
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/gradle/wrapper

        cp index.html android/app/src/main/assets/
        cp icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

        cat > android/settings.gradle << 'GRADLE'
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "OPIc"
        include ':app'
        GRADLE

        cat > android/build.gradle << 'GRADLE'
        plugins {
            id 'com.android.application' version '8.1.4' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        GRADLE

        cat > android/gradle.properties << 'GRADLE'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        kotlin.code.style=official
        GRADLE

        cat > android/app/build.gradle << 'GRADLE'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.opic.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.opic.app"
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "2.0"
            }
            buildTypes {
                release { minifyEnabled false }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            kotlinOptions { jvmTarget = '1.8' }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.8.0'
        }
        GRADLE

        cat > android/app/src/main/AndroidManifest.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.opic.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/Theme.OPIc"
                android:hardwareAccelerated="true"
                android:requestLegacyExternalStorage="true">
                <activity android:name=".MainActivity" android:exported="true"
                    android:screenOrientation="portrait"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        XML

        cat > android/app/src/main/java/com/opic/app/MainActivity.kt << 'KT'
        package com.opic.app
        import android.annotation.SuppressLint
        import android.content.Context
        import android.speech.tts.TextToSpeech
        import android.os.Bundle
        import android.webkit.*
        import android.view.View
        import android.view.WindowManager
        import androidx.appcompat.app.AppCompatActivity

        // 재설치 후에도 데이터 유지 (Downloads 폴더 JSON 백업 + SharedPreferences)
        class AndroidBridge(private val context: Context) {
            private val prefs = context.getSharedPreferences("opic_data", Context.MODE_PRIVATE)
            private val BACKUP_FILE = "OPIc_study_backup.json"

            init {
                // 앱 시작: SharedPreferences 비어있으면 Downloads 백업에서 복원
                if (!prefs.contains("opic_profile")) restoreFromDownloads()
            }

            @JavascriptInterface
            fun saveData(key: String, value: String) {
                prefs.edit().putString(key, value).apply()
                if (key == "opic_profile" || key == "opic_progress" || key == "opic_quiz_best") {
                    saveToDownloads()
                }
            }
            @JavascriptInterface
            fun getData(key: String): String = prefs.getString(key, "") ?: ""
            @JavascriptInterface
            fun removeData(key: String) {
                prefs.edit().remove(key).apply()
                saveToDownloads()
            }

            private fun buildJson(): String {
                val sb = StringBuilder("{")
                var first = true
                prefs.all.forEach { (k, v) ->
                    if (!first) sb.append(",")
                    sb.append("\"").append(k).append("\":\"")
                    sb.append(v.toString().replace("\\","\\\\").replace("\"","\\\""))
                    sb.append("\"")
                    first = false
                }
                sb.append("}")
                return sb.toString()
            }

            private fun saveToDownloads() {
                try {
                    val jsonStr = buildJson()
                    if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {
                        saveAndroid10Plus(jsonStr)
                    } else {
                        val dir = android.os.Environment.getExternalStoragePublicDirectory(
                            android.os.Environment.DIRECTORY_DOWNLOADS)
                        java.io.File(dir, BACKUP_FILE).writeText(jsonStr)
                    }
                } catch(e: Exception) {}
            }

            private fun saveAndroid10Plus(jsonStr: String) {
                val resolver = context.contentResolver
                val existing = resolver.query(
                    android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                    arrayOf(android.provider.MediaStore.Downloads._ID),
                    "${android.provider.MediaStore.Downloads.DISPLAY_NAME} = ?",
                    arrayOf(BACKUP_FILE), null
                )?.use { c ->
                    if (c.moveToFirst()) android.net.Uri.withAppendedPath(
                        android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                        c.getLong(0).toString()) else null
                }
                val uri = existing ?: run {
                    val cv = android.content.ContentValues().apply {
                        put(android.provider.MediaStore.Downloads.DISPLAY_NAME, BACKUP_FILE)
                        put(android.provider.MediaStore.Downloads.MIME_TYPE, "application/json")
                    }
                    resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                } ?: return
                resolver.openOutputStream(uri, "wt")?.use { it.write(jsonStr.toByteArray()) }
            }

            private fun restoreFromDownloads() {
                try {
                    val jsonStr = if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {
                        restoreAndroid10Plus()
                    } else {
                        val f = java.io.File(
                            android.os.Environment.getExternalStoragePublicDirectory(
                                android.os.Environment.DIRECTORY_DOWNLOADS), BACKUP_FILE)
                        if (f.exists()) f.readText() else null
                    } ?: return
                    // 간단한 JSON 파싱 (org.json 없이)
                    val edit = prefs.edit()
                    val pattern = Regex("\"([^\"]+)\":\"((?:[^\\\"]|\\\\.)*)\"")
                    pattern.findAll(jsonStr).forEach { m ->
                        edit.putString(m.groupValues[1], m.groupValues[2]
                            .replace("\\\"", "\"").replace("\\\\","\\"))
                    }
                    edit.apply()
                } catch(e: Exception) {}
            }

            private fun restoreAndroid10Plus(): String? {
                return try {
                    val resolver = context.contentResolver
                    resolver.query(
                        android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                        arrayOf(android.provider.MediaStore.Downloads._ID),
                        "${android.provider.MediaStore.Downloads.DISPLAY_NAME} = ?",
                        arrayOf(BACKUP_FILE), null
                    )?.use { c ->
                        if (!c.moveToFirst()) return null
                        val uri = android.net.Uri.withAppendedPath(
                            android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                            c.getLong(0).toString())
                        resolver.openInputStream(uri)?.use { it.reader().readText() }
                    }
                } catch(e: Exception) { null }
            }
        }

        // Android 네이티브 TTS (WebView Web Speech API 대체)
        class AndroidTTS(private val context: Context) : TextToSpeech.OnInitListener {
            private val tts: TextToSpeech = TextToSpeech(context, this)
            private var ready = false
            override fun onInit(status: Int) {
                if (status == TextToSpeech.SUCCESS) {
                    tts.setLanguage(java.util.Locale.US)
                    ready = true
                }
            }
            @JavascriptInterface
            fun speak(text: String, rate: Float) {
                if (!ready) return
                tts.setSpeechRate(rate)
                tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "opic_tts")
            }
            @JavascriptInterface
            fun stop() { if (ready) tts.stop() }
            @JavascriptInterface
            fun isSpeaking(): Boolean = ready && tts.isSpeaking
            fun shutdown() { if (ready) tts.shutdown() }
        }

        class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView
            private lateinit var androidTTS: AndroidTTS
            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
                supportActionBar?.hide()
                webView = WebView(this)
                webView.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                setContentView(webView)
                webView.settings.apply {
                    javaScriptEnabled = true
                    domStorageEnabled = true
                    databaseEnabled = true
                    allowFileAccess = true
                    allowContentAccess = true
                    setSupportZoom(false)
                    displayZoomControls = false
                    useWideViewPort = true
                    loadWithOverviewMode = true
                    mediaPlaybackRequiresUserGesture = false
                    cacheMode = WebSettings.LOAD_NO_CACHE
                }
                // AndroidBridge 등록: window.AndroidBridge 로 접근 가능
                webView.addJavascriptInterface(AndroidBridge(this), "AndroidBridge")
                // AndroidTTS 등록: window.AndroidTTS 로 접근 가능
                androidTTS = AndroidTTS(this)
                webView.addJavascriptInterface(androidTTS, "AndroidTTS")
                webView.webChromeClient = object : WebChromeClient() {
                    override fun onPermissionRequest(request: android.webkit.PermissionRequest) {
                        request.grant(request.resources)
                    }
                }
                webView.webViewClient = object : WebViewClient() {
                    override fun onPageFinished(view: WebView?, url: String?) {
                        super.onPageFinished(view, url)
                        view?.invalidate()
                    }
                }
                webView.loadUrl("file:///android_asset/index.html")
            }
            override fun onResume() {
                super.onResume()
                if (::webView.isInitialized) {
                    webView.invalidate()
                    webView.evaluateJavascript(
                        "document.body.style.opacity='0.999';setTimeout(function(){document.body.style.opacity='';},50);", null)
                }
            }
            override fun onDestroy() {
                if (::androidTTS.isInitialized) androidTTS.shutdown()
                super.onDestroy()
            }
            @Deprecated("Deprecated in Java")
            override fun onBackPressed() {
                if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
            }
        }
        KT

        cat > android/app/src/main/res/values/strings.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <resources><string name="app_name">OPIc 영어 학습</string></resources>
        XML

        cat > android/app/src/main/res/values/themes.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.OPIc" parent="Theme.AppCompat.NoActionBar">
                <item name="android:windowBackground">#0f172a</item>
                <item name="android:statusBarColor">#0f172a</item>
                <item name="android:navigationBarColor">#0f172a</item>
            </style>
        </resources>
        XML

        cat > android/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        PROPS

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.0'

    - name: Build APK
      run: |
        cd android
        gradle assembleDebug

    - name: Rename APK
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk OPIc_study_app.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OPIc-study-app
        path: OPIc_study_app.apk
        retention-days: 90

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "OPIc 영어 학습 앱 - 최신 버전"
        body: |
          ## OPIc 영어 학습 앱

          📱 **아래 APK 파일을 눌러 다운로드 후 설치하세요**

          ### 설치 방법
          1. `OPIc_study_app.apk` 다운로드
          2. 안드로이드 설정 → 알 수 없는 앱 설치 허용
          3. 다운로드된 APK 실행하여 설치

          ### 포함 기능
          - 📚 OPIc 주제별 문답 학습
          - 🃏 단어 플래시카드
          - 🧠 영어 단어 퀴즈 (10~50문항 선택)
          - 🔊 TTS 원어민 발음
          - 🏆 학습 진도 관리
        files: OPIc_study_app.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
