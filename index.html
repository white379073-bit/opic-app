</script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #0f172a; color: #f1f5f9;
      min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    /* S24 Ultra 기준: CSS viewport ~412px, 고해상도 AMOLED */
    #root {
      max-width: 430px; margin: 0 auto;
      min-height: 100vh; position: relative;
    }
    
    .screen {
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 16px));
      min-height: 100vh;
    }
    
    /* ── 탑바 ── */
    .top-bar {
      padding: 16px 20px 14px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid rgba(99,102,241,0.2);
    }
    .top-bar h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .top-bar p { font-size: 12px; color: #64748b; margin-top: 2px; }

    /* ── 하단 네비게이션: 안전 영역 포함 ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: #1a2540;
      border-top: 1px solid rgba(99,102,241,0.25);
      display: flex; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 4px 8px; cursor: pointer;
      transition: all 0.2s; border: none; background: none;
      color: #475569; font-size: 10px; font-weight: 600; gap: 4px;
      min-height: 56px; /* S24 터치 타겟 최소 56px */
    }
    .nav-btn.active { color: #818cf8; }
    .nav-btn .nav-icon { font-size: 24px; transition: transform 0.2s; }
    .nav-btn.active .nav-icon { transform: scale(1.1); }
    .nav-btn:active { opacity: 0.7; }

    /* ── 카드 ── */
    .card {
      background: #1e293b; border-radius: 18px;
      padding: 20px; margin: 0 14px 14px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .card-glass {
      background: rgba(30,41,59,0.85); backdrop-filter: blur(10px);
      border-radius: 18px; padding: 20px; margin: 0 14px 14px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ── 버튼: S24 터치 기준 최소 52px ── */
    .btn {
      border-radius: 14px; border: none; cursor: pointer;
      font-weight: 700; transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 52px; font-size: 15px;
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; padding: 14px 24px; width: 100%;
    }
    .btn-secondary {
      background: rgba(99,102,241,0.15); color: #818cf8;
      padding: 12px 20px; font-size: 14px;
      border: 1px solid rgba(99,102,241,0.3); min-height: 48px;
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; padding: 12px 20px; min-height: 48px;
    }
    .btn-danger {
      background: rgba(239,68,68,0.15); color: #f87171;
      padding: 12px 20px; font-size: 14px;
      border: 1px solid rgba(239,68,68,0.3); min-height: 48px;
    }

    /* ── 진행 바 ── */
    .progress-bar { background: rgba(99,102,241,0.2); border-radius: 999px; height: 7px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366f1, #34d399); transition: width 0.5s ease; }

    /* ── 뱃지 ── */

  home: ["{{locationKo}}의 아파트에 살고 있습니다. 고층에 있어 도시 전경이 잘 보입니다. 거실, 침실 2개, 주방, 욕실로 구성된 아늑한 공간입니다. 몇 년째 살고 있는데 정말 마음에 듭니다.", "동네가 매우 편리해서 좋습니다. 걸어갈 거리에 식당, 카페, 마트가 많고, 지하철역도 5분 거리입니다. 근처 공원에서 산책도 할 수 있고, 안전하고 친근한 분위기입니다.", "동네가 수년간 많이 변했습니다. 새 카페와 가게들이 생겨 훨씬 활기차졌고, 쇼핑센터도 생겼습니다. 조금 더 혼잡해졌지만 전반적으로 긍정적인 변화입니다.", "집에서는 단순하고 편안하게 지냅니다. 직접 요리를 하고, 저녁에는 영화나 드라마를 봅니다. 주말에는 청소하거나 친구들을 초대하기도 합니다.", "도시 생활은 장단점이 있습니다. 긍정적으로는 대중교통이 훌륭하고 모든 것이 접근하기 쉽습니다. 반면 생활비가 높고 시끄러울 수 있습니다. 전반적으로는 도시의 편리함을 선호합니다."],
  travel: ["여행을 정말 좋아합니다! 일본, 태국 등 아시아를 방문했고, 국내에서는 제주도, 부산, 경주 등을 다녔습니다. 여행은 시야를 넓혀주고 새로운 관점을 갖게 해줍니다.", "가장 기억에 남는 여행은 봄에 방문한 일본 교토입니다. 벚꽃이 절경이었고, 전통 사원들과 현지 음식도 훌륭했습니다. 친구들과 함께해서 평생 잊지 못할 여행이었습니다.", "자유 여행을 훨씬 선호합니다. 내 일정대로 원하는 속도로 여행하며 숨겨진 명소를 발견하는 재미가 있습니다. 더 많은 준비가 필요하지만 그 자유로움이 충분히 가치 있습니다.", "여행 시 스마트폰과 충전기는 필수입니다. 보조 배터리와 가벼운 재킷도 항상 챙기고, 카드를 받지 않는 곳을 위해 현금도 준비합니다.", "여행이 저를 더 열린 마음과 적응력을 가진 사람으로 변화시켰습니다. 다양한 문화를 경험하며 더 넓은 시각과 높은 공감 능력을 갖게 되었습니다."],
  food: ["가장 좋아하는 음식은 한국 바베큐입니다. 삼겹살을 신선한 채소와 함께 먹는 것을 특히 좋아하고, 김치찌개 같은 얼큰한 찌개도 즐깁니다. 외국 음식 중에는 일식을 좋아합니다.", "집 근처 20년 된 한국 바베큐 식당을 자주 찾습니다. 고기 품질이 뛰어나고 반찬이 항상 신선합니다. 고급스럽지 않지만 음식이 맛있고 가격이 합리적입니다.", "집밥과 외식을 적절히 섞는 편입니다. 평일에는 주로 집에서 요리해 먹고, 주말에는 외식으로 자신에게 선물합니다. 두 가지 방식 모두 나름의 장점이 있습니다.", "식습관이 많이 변했습니다. 예전에는 패스트푸드를 즐겼지만, 지금은 채소와 단백질 중심의 균형 잡힌 식단을 유지하고 가공식품과 단 음료를 줄였습니다.", "편식하지는 않지만, 매우 신 음식이나 기름진 음식은 좋아하지 않습니다. 유당불내증이 있어 유제품을 제한하지만, 새로운 음식에 도전하는 것을 즐깁니다."],
  shopping: ["쇼핑을 즐기지만 충동구매는 하지 않습니다. 식료품은 마트를, 옷은 온라인 쇼핑을 선호하고, 신발이나 전자 기기는 직접 보고 사기 위해 오프라인 매장을 방문합니다.", "대부분은 온라인 쇼핑을 선호합니다. 언제든 편하게 구매하고 배달받을 수 있고 가격도 저렴합니다. 단, 직접 확인이 필요한 물건은 매장을 방문합니다.", "어머니 생일 선물을 찾으러 여러 매장을 돌아다니다 부티크에서 실크 스카프를 발견한 것이 기억에 남습니다. 가게 주인의 도움으로 완벽한 선택을 했고 어머니가 매우 감동받으셨습니다.", "쇼핑 습관이 온라인 중심으로 바뀌었습니다. 또한 저렴한 물건보다 오래 쓸 수 있는 질 좋은 물건에 투자하고, 불필요한 구매를 줄이려 합니다.", "구매 전 실제 필요 여부, 가격 비교, 리뷰 확인, 브랜드 평판을 고려합니다. 큰 구매는 시간을 들여 충분히 조사한 후 결정합니다."],
  entertainment: ["영화를 정말 좋아합니다. 액션과 SF 장르를 선호하며, 마블 영화와 크리스토퍼 놀란 작품들을 즐깁니다. 최근 한국 영화도 훌륭한 작품들이 많습니다.", "봉준호 감독의 기생충이 가장 인상적이었습니다. 계층 불평등을 영리하고 예상치 못한 방식으로 다루었고, 코미디에서 강렬한 긴장감으로 변해가는 구조가 탁월했습니다.", "K팝, 한국 힙합, 서양 팝과 R&B 등 다양한 음악을 즐깁니다. 출퇴근 중에 음악을 자주 듣고, 업무 중에는 집중을 위해 잔잔한 연주 음악을 듣습니다.", "영화관과 집 시청 모두 즐기지만 이유가 다릅니다. 큰 액션 영화는 영화관의 몰입감을, 소규모 작품은 집의 편안함을 선택합니다.", "K팝 콘서트에서 수천 명의 팬들과 함께하는 경험이 정말 인상적이었습니다. 화려한 조명 쇼와 라이브 공연의 에너지가 뮤직비디오와는 완전히 다른 경험이었습니다."],
  health: ["건강을 진지하게 관리합니다. 주 3회 달리기나 홈트레이닝을 하고, 채소와 단백질 중심의 균형 잡힌 식단을 유지합니다. 7~8시간 수면을 취하고 신체적·정신적 건강 모두를 중요시합니다.", "등산을 가장 좋아합니다. 주 몇 회 달리기를 하고, 최근 저항 밴드 근력 운동도 시작했습니다. 예전에는 주말에 축구를 즐겼지만 요즘은 시간이 부족합니다.", "20대에는 건강에 무관심했지만, 나이가 들면서 중요성을 깨달았습니다. 규칙적인 운동, 개선된 식단, 충분한 수면을 우선시하고, 건강을 미래 삶의 질을 위한 투자로 봅니다.", "요즘 사람들이 훨씬 건강에 관심이 많아졌습니다. 소셜 미디어가 건강 트렌드를 확산시키고, 헬스장이나 마음챙김을 실천하는 사람이 늘었습니다. 다만 앉아서 생활하는 방식이나 스트레스성 질환 같은 문제도 여전히 있습니다.", "몇 년 전 장시간 앉아 있어 허리 통증이 생겼습니다. 의사 권고로 스트레칭 운동과 인체공학적 의자를 도입하고 매 시간 일어나는 습관을 들여 몇 달 만에 통증이 개선되었습니다."],
  tech: ["스마트폰을 가장 많이 사용합니다. 소통, 내비게이션, 쇼핑, 뱅킹, 엔터테인먼트 모두 스마트폰에 의존합니다. 노트북과 스마트 스피커도 일상의 일부가 되었습니다.", "기술이 삶을 다양하게 변화시켰습니다. 소통이 즉각적이고, 원격 근무가 가능해졌으며, 수천 편의 콘텐츠를 손끝에서 이용할 수 있습니다. 화면 과다 사용 같은 부작용도 인식하고 있습니다.", "인공지능이 가장 인상적입니다. 기계가 자연어를 생성하고 복잡한 문제를 해결하는 것이 놀랍습니다. 제 검증 업무에서도 AI가 테스트 자동화에 점점 더 큰 역할을 하고 있습니다.", "기술의 부작용도 있습니다. 과도한 소셜 미디어가 불안·우울증과 연관되고, 개인 정보 보안 문제도 있습니다. 자동화로 인한 일자리 문제도 심각합니다. 기술을 의식적으로 사용하는 것이 중요합니다.", "의료 기술, 특히 AI 기반 조기 진단과 개인화 의료에 기대가 큽니다. 전기차, 재생 에너지, 자율주행 자동차도 보고 싶습니다. 통근 중에 쉬거나 일할 수 있다면 정말 좋을 것 같습니다."]

// ── Persistent Storage: AndroidBridge(재설치 생존) > localStorage 폴백 ──
var Storage = {
  getItem: function(key) {
    try {
      if (window.AndroidBridge) {
        var v = window.AndroidBridge.getData(key);
        return (v !== null && v !== undefined && v !== '') ? v : null;
      }
      return localStorage.getItem(key);
    } catch(e) { return null; }
  },
  setItem: function(key, value) {
    try {
      if (window.AndroidBridge) window.AndroidBridge.saveData(key, value);
      localStorage.setItem(key, value);
    } catch(e) {}
  },
  removeItem: function(key) {
    try {
      if (window.AndroidBridge) window.AndroidBridge.removeData(key);
      localStorage.removeItem(key);
    } catch(e) {}
  }
};

function loadProgress() {
  try {
    var data = Storage.getItem('opic_progress');
    var p = data ? JSON.parse(data) : {
      completedQ: {},
      masteredCards: [],
      streak: 0,
      lastDate: null
    };
    // ── 마이그레이션: 숫자 인덱스 → 영어 단어 string 변환 (앱 업데이트 후에도 암기 데이터 유지) ──
    if (p.masteredCards && p.masteredCards.length > 0 && typeof p.masteredCards[0] === 'number') {
      p.masteredCards = p.masteredCards.map(function (idx) {
        return FLASHCARDS[idx] ? FLASHCARDS[idx].en : null;
      }).filter(Boolean);
      Storage.setItem('opic_progress', JSON.stringify(p));
    }
    return p;
  } catch (_unused) {
    return {
      completedQ: {},
      masteredCards: [],
      streak: 0,
      lastDate: null
    };
  }
}
function saveProgress(p) {
  try {
    Storage.setItem('opic_progress', JSON.stringify(p));
  } catch (_unused2) {}
}
function todayStr() {
  return new Date().toISOString().split('T')[0];
}

}
