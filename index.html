<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OPIc 영어 학습</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: #0f172a; color: #f1f5f9;
      min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    /* S24 Ultra 기준: CSS viewport ~412px, 고해상도 AMOLED */
    #root {
      max-width: 430px; margin: 0 auto;
      min-height: 100vh; position: relative;
    }
    
    .screen {
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 16px));
      min-height: 100vh;
    }
    
    /* ── 탑바 ── */
    .top-bar {
      padding: 16px 20px 14px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid rgba(99,102,241,0.2);
    }
    .top-bar h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .top-bar p { font-size: 12px; color: #64748b; margin-top: 2px; }

    /* ── 하단 네비게이션: 안전 영역 포함 ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: #1a2540;
      border-top: 1px solid rgba(99,102,241,0.25);
      display: flex; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 4px 8px; cursor: pointer;
      transition: all 0.2s; border: none; background: none;
      color: #475569; font-size: 10px; font-weight: 600; gap: 4px;
      min-height: 56px; /* S24 터치 타겟 최소 56px */
    }
    .nav-btn.active { color: #818cf8; }
    .nav-btn .nav-icon { font-size: 24px; transition: transform 0.2s; }
    .nav-btn.active .nav-icon { transform: scale(1.1); }
    .nav-btn:active { opacity: 0.7; }

    /* ── 카드 ── */
    .card {
      background: #1e293b; border-radius: 18px;
      padding: 20px; margin: 0 14px 14px;
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .card-glass {
      background: rgba(30,41,59,0.85);
      border-radius: 18px; padding: 20px; margin: 0 14px 14px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ── 버튼: S24 터치 기준 최소 52px ── */
    .btn {
      border-radius: 14px; border: none; cursor: pointer;
      font-weight: 700; transition: all 0.15s;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 52px; font-size: 15px;
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; padding: 14px 24px; width: 100%;
    }
    .btn-secondary {
      background: rgba(99,102,241,0.15); color: #818cf8;
      padding: 12px 20px; font-size: 14px;
      border: 1px solid rgba(99,102,241,0.3); min-height: 48px;
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; padding: 12px 20px; min-height: 48px;
    }
    .btn-danger {
      background: rgba(239,68,68,0.15); color: #f87171;
      padding: 12px 20px; font-size: 14px;
      border: 1px solid rgba(239,68,68,0.3); min-height: 48px;
    }

    /* ── 진행 바 ── */
    .progress-bar { background: rgba(99,102,241,0.2); border-radius: 999px; height: 7px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6366f1, #34d399); transition: width 0.5s ease; }

    /* ── 뱃지 ── */
    .badge { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-purple { background: rgba(99,102,241,0.2); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
    .badge-green { background: rgba(52,211,153,0.2); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
    .badge-yellow { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }

    /* ── 플래시카드: S24 세로 화면 최적화 ── */
    .flip-card { perspective: 1000px; height: 240px; cursor: pointer; margin: 0 14px; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
    .flip-card-inner.flipped { transform: rotateY(180deg); }
    .flip-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; }
    .flip-front { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(99,102,241,0.3); }
    .flip-back { background: linear-gradient(135deg, #0f2027, #1a1a2e); border: 1px solid rgba(52,211,153,0.3); transform: rotateY(180deg); }

    /* ── 답변 카드 ── */
    .answer-card { background: linear-gradient(135deg, #0f2027 0%, #1e293b 100%); border-radius: 16px; padding: 20px; border: 1px solid rgba(52,211,153,0.2); margin-top: 14px; }

    /* ── 스탯 카드 ── */
    .stat-card { background: #1e293b; border-radius: 16px; padding: 18px 14px; border: 1px solid rgba(255,255,255,0.07); text-align: center; }

    /* ── 토픽 그리드: 2열, 충분한 여백 ── */
    .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14px; }
    .topic-card {
      background: #1e293b; border-radius: 16px; padding: 18px 14px;
      cursor: pointer; transition: all 0.18s;
      border: 1px solid rgba(255,255,255,0.07); position: relative; overflow: hidden;
      min-height: 100px; /* 터치 타겟 */
    }
    .topic-card:active { transform: scale(0.95); opacity: 0.9; }
    .topic-card.done { border-color: rgba(52,211,153,0.3); }
    .topic-emoji { font-size: 30px; margin-bottom: 8px; }
    .topic-name { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .topic-count { font-size: 11px; color: #64748b; }

    /* ── 스크롤 영역 ── */
    .scroll-content { padding-top: 14px; }
    .section-title { font-size: 15px; font-weight: 700; color: #94a3b8; padding: 0 14px; margin-bottom: 12px; }

    /* ── 질문 아이템: 터치 타겟 넉넉히 ── */
    .question-item {
      background: #1e293b; border-radius: 14px;
      padding: 16px 14px; margin: 0 14px 10px;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: flex-start; gap: 12px;
      transition: all 0.15s; min-height: 60px;
    }
    .question-item:active { transform: scale(0.98); opacity: 0.85; }
    .question-item.done { border-color: rgba(52,211,153,0.25); background: rgba(52,211,153,0.05); }
    .q-num { width: 32px; height: 32px; border-radius: 50%; background: rgba(99,102,241,0.2); color: #818cf8; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .q-num.done { background: rgba(52,211,153,0.2); color: #34d399; }
    .q-text { font-size: 14px; color: #cbd5e1; line-height: 1.55; flex: 1; }

    /* ── 뒤로가기 버튼 ── */
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 12px 16px; color: #818cf8; font-size: 15px;
      cursor: pointer; background: none; border: none; font-weight: 700;
      min-height: 48px;
    }

    /* ── 기타 ── */
    .streak-flame { font-size: 30px; }
    ::-webkit-scrollbar { display: none; }
    
    /* ── 토스트 ── */
    .toast {
      position: fixed; top: calc(20px + env(safe-area-inset-top, 0px));
      left: 50%; transform: translateX(-50%);
      background: #10b981; color: white;
      padding: 12px 22px; border-radius: 999px;
      font-size: 14px; font-weight: 700; z-index: 999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      max-width: 300px; text-align: center;
    }
    .toast.show { opacity: 1; }

    .info-chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px; padding: 5px 11px; font-size: 12px; color: #818cf8; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .pulse { animation: pulse 2s infinite; }

    /* ── 음성 TTS ── */
    .speak-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; transition: all 0.2s; min-height: 44px; }
    .speak-btn-idle { background: rgba(99,102,241,0.15); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
    .speak-btn-idle:active { transform: scale(0.95); }
    .speak-btn-speaking { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.4); }
    .speak-btn-paused { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .sound-bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
    .sound-bar { width: 3px; border-radius: 2px; background: currentColor; }
    .sound-bar:nth-child(1) { animation: soundWave 0.8s ease-in-out infinite; height: 6px; }
    .sound-bar:nth-child(2) { animation: soundWave 0.8s ease-in-out infinite 0.15s; height: 12px; }
    .sound-bar:nth-child(3) { animation: soundWave 0.8s ease-in-out infinite 0.3s; height: 16px; }
    .sound-bar:nth-child(4) { animation: soundWave 0.8s ease-in-out infinite 0.15s; height: 10px; }
    .sound-bar:nth-child(5) { animation: soundWave 0.8s ease-in-out infinite 0.05s; height: 6px; }
    @keyframes soundWave { 0%,100% { transform: scaleY(0.4); opacity: 0.6; } 50% { transform: scaleY(1); opacity: 1; } }
    .voice-panel { background: rgba(15,23,42,0.95); border-top: 1px solid rgba(99,102,241,0.2); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .speed-btn { padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(99,102,241,0.25); background: rgba(99,102,241,0.08); color: #94a3b8; font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 600; min-height: 36px; }
    .speed-btn.active { background: rgba(99,102,241,0.3); color: #818cf8; border-color: rgba(99,102,241,0.5); }
    .speaking-indicator { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(52,211,153,0.1); border-radius: 999px; border: 1px solid rgba(52,211,153,0.3); font-size: 12px; color: #34d399; font-weight: 600; }
    .auto-play-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #64748b; }
    .toggle-switch { position: relative; width: 40px; height: 22px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #1e293b; border-radius: 999px; cursor: pointer; border: 1px solid rgba(99,102,241,0.3); transition: 0.3s; }
    .toggle-slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #64748b; border-radius: 50%; transition: 0.3s; }
    input:checked + .toggle-slider { background: rgba(99,102,241,0.3); border-color: #6366f1; }
    input:checked + .toggle-slider:before { transform: translateX(18px); background: #818cf8; }

    /* ── 프로필 설정 ── */
    .profile-screen { min-height: 100vh; background: #0f172a; display: flex; flex-direction: column; }
    .profile-header { padding: 44px 24px 20px; padding-top: calc(44px + env(safe-area-inset-top, 0px)); text-align: center; }
    .profile-header h2 { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .profile-header p { font-size: 14px; color: #64748b; line-height: 1.6; }
    .step-dots { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #1e293b; transition: all 0.3s; }
    .step-dot.active { width: 24px; border-radius: 4px; background: #6366f1; }
    .step-dot.done { background: #34d399; }
    .profile-form { flex: 1; padding: 0 20px; overflow-y: auto; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.5px; }
    .form-label span { color: #64748b; font-weight: 400; font-size: 11px; }
    .form-input { width: 100%; background: #1e293b; border: 1px solid rgba(99,102,241,0.25); border-radius: 14px; padding: 14px 16px; color: #f1f5f9; font-size: 16px; outline: none; transition: border-color 0.2s; min-height: 52px; }
    .form-input:focus { border-color: rgba(99,102,241,0.6); background: rgba(30,41,59,0.9); }
    .form-input::placeholder { color: #475569; font-size: 14px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-hint { font-size: 12px; color: #475569; margin-top: 5px; padding-left: 2px; }
    .profile-footer { padding: 16px 20px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 16px)); display: flex; gap: 10px; }
    .preview-box { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); border-radius: 14px; padding: 16px; margin: 12px 0 16px; }
    .preview-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; color: #818cf8; }
    .preview-text { font-size: 14px; color: #cbd5e1; line-height: 1.7; }
    .section-divider { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
    .section-divider span { font-size: 12px; font-weight: 700; color: #6366f1; white-space: nowrap; }
    .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: rgba(99,102,241,0.2); }

    /* ── 칩 선택 버튼 ── */
    .chip-btn {
      padding: 10px 16px; border-radius: 22px; border: 1.5px solid rgba(99,102,241,0.3);
      background: rgba(30,41,59,0.8); color: #94a3b8;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; min-height: 42px;
    }
    .chip-btn.selected {
      background: rgba(99,102,241,0.25); color: #a5b4fc;
      border-color: #6366f1;
    }
    .chip-btn:active { transform: scale(0.94); }
</style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OPIc 학습">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(r => console.log('SW 등록:', r.scope))
          .catch(e => console.warn('SW 실패:', e));
      });
    }
  </script>

</head>

function loadProgress() {
  try {
    var data = localStorage.getItem('opic_progress');
    var p = data ? JSON.parse(data) : {
      completedQ: {},
      masteredCards: [],
      streak: 0,
      lastDate: null
    };
    // ── 마이그레이션: 숫자 인덱스 → 영어 단어 string 변환 (앱 업데이트 후에도 암기 데이터 유지) ──
    if (p.masteredCards && p.masteredCards.length > 0 && typeof p.masteredCards[0] === 'number') {
      p.masteredCards = p.masteredCards.map(function (idx) {
        return FLASHCARDS[idx] ? FLASHCARDS[idx].en : null;
      }).filter(Boolean);
      localStorage.setItem('opic_progress', JSON.stringify(p));
    }
    return p;
  } catch (_unused) {
    return {
      completedQ: {},
      masteredCards: [],
      streak: 0,
      lastDate: null
    };
  }
}
function saveProgress(p) {
  try {
    localStorage.setItem('opic_progress', JSON.stringify(p));
  } catch (_unused2) {}
}
function todayStr() {
  return new Date().toISOString().split('T')[0];
}

  if (n >= 300) return {

  if (n >= 150) return {

    color: '#fbbf24'

  if (n >= 50) return {

    label: 'Learner',
    color: '#34d399'

  return {

    label: 'Starter',
    color: '#94a3b8'
  };
}
